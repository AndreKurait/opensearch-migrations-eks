name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Markdown lint
        run: npm run lint:md

      - name: ESLint
        run: npm run lint:js

      - name: Build
        run: npm run build

      - name: HTML lint
        run: npm run lint:html

      - name: Link check
        run: npm run check:links

      - name: Install accessibility-test browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Accessibility check
        run: |
          ./node_modules/.bin/astro preview --host 127.0.0.1 --port 4321 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/opensearch-migrations-eks/ >/dev/null; then
              break
            fi
            kill -0 "$preview_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4321/opensearch-migrations-eks/ >/dev/null
          npm run check:a11y

      - name: Browser regression tests
        run: npm test -- --workers=2
